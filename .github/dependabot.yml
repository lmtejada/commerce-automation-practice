version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # One PR for all minor/patch bumps; majors still get their own PR for review.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node must match the Node major in .nvmrc; bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
